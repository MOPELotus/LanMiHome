[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanmihome-cuktech-ble-probe"
version = "0.1.0"
description = "Minimal multi-device CUKTECH AD1204 BLE probe for LanMiHome"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.21",
    "cryptography>=41",
]

[project.scripts]
cuktech-probe = "lanmihome_cuktech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
