name: CUKTECH BLE Probe

on:
  push:
    paths:
      - "tools/cuktech_ble_probe/**"
      - ".github/workflows/cuktech-ble-probe.yml"
  pull_request:
    paths:
      - "tools/cuktech_ble_probe/**"
      - ".github/workflows/cuktech-ble-probe.yml"

jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core
        run: python -m pip install -e tools/cuktech_ble_probe
      - name: Compile
        run: python -m compileall -q tools/cuktech_ble_probe/src
      - name: Unit tests
        run: python -m unittest discover -s tools/cuktech_ble_probe/tests -v
      - name: CLI smoke test
        run: python -m lanmihome_cuktech --help
