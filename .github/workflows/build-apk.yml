name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: python -m pip install -r router/requirements-test.txt
      - name: Test light-strip API and safety boundaries
        run: python -m unittest discover -s router/tests -v
      - name: Test existing CUKTECH BLE behavior
        env:
          PYTHONPATH: tools/cuktech_ble_probe/src
        run: python -m unittest discover -s tools/cuktech_ble_probe/tests -v

  build:
    needs: test-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build LanMiHome APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload LanMiHome APK
        uses: actions/upload-artifact@v4
        with:
          name: LanMiHome-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
