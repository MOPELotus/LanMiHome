name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build gateway and client APKs
        run: gradle --no-daemon :app:assembleGatewayDebug :app:assembleClientDebug --stacktrace
      - name: Upload gateway APK
        uses: actions/upload-artifact@v4
        with:
          name: LanMiHome-gateway-debug-apk
          path: app/build/outputs/apk/gateway/debug/app-gateway-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload client APK
        uses: actions/upload-artifact@v4
        with:
          name: LanMiHome-client-debug-apk
          path: app/build/outputs/apk/client/debug/app-client-debug.apk
          if-no-files-found: error
          retention-days: 30
